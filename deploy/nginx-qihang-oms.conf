# 启航 OMS Nginx 站点模板（__DOMAIN__/__PORT__/__ROOT__ 由 install.sh 替换）
server {
    listen __WEB_PORT__;
    listen [::]:__WEB_PORT__;
    server_name __DOMAIN__;

    root __ROOT__/web/dist;
    index index.html;

    # 前端构建已产出 .gz 预压缩文件，直接复用（省 CPU）
    gzip_static on;

    # 动态 API 响应压缩（省带宽；弱 CPU 机器用低压缩级别）
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1k;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css text/xml application/xml;

    access_log /var/log/nginx/qihang-oms.access.log;
    error_log  /var/log/nginx/qihang-oms.error.log;

    client_max_body_size 50m;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（对应前端 VUE_APP_BASE_API=/prod-api）
    location /prod-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:__PORT__/;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
