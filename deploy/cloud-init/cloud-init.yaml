#cloud-config
# =====================================================================
# 启航 OMS —— 甲骨文云 Ubuntu 24.04 cloud-init 一键初始化
# （对齐 3x-ui deploy/cloud-init 模式；配合 deploy/install.sh 非交互安装）
#
# 用法：甲骨文控制台创建实例时，在「高级选项 -> 用户数据/Cloud-init」粘贴本文件，
#       先替换下方 write_files 中的三个占位值：
#         yourname/qihang-oms   你的 GitHub 仓库（已发布 Release）
#         oms.example.com       你的访问域名（无域名填 _ ，用 IP 访问）
#         ghp_xxxxxxxxxxxxxxxx  私有仓库必填（只读 PAT，勾选 repo）；公共仓库改空
#         WEB_PORT=30545        对外端口，改成与甲骨文安全列表放行一致的端口
#
# 实例开机后自动完成：防火墙放行 -> 下载部署脚本 -> install.sh 非交互安装（约 5-10 分钟）
# 查看进度（SSH 登录后）：
#   tail -f /var/log/cloud-init-output.log      # cloud-init 总日志
#   tail -f /var/log/qihang-install.log         # install.sh 安装日志
# 完成后重新登录 SSH，欢迎屏（MOTD）将显示访问地址与版本。
# =====================================================================
package_update: false
package_upgrade: false

write_files:
  - path: /root/qihang-install.env
    permissions: '0600'
    content: |
      QIHANG_NONINTERACTIVE=1
      GITHUB_REPO=yourname/qihang-oms
      DOMAIN=oms.example.com
      APP_PORT=8086
      # 对外访问端口（Nginx 监听），须与甲骨文安全列表放行的端口一致
      WEB_PORT=30545
      GITHUB_TOKEN=ghp_xxxxxxxxxxxxxxxx

runcmd:
  # ---- [1] 甲骨文 Ubuntu 镜像默认 iptables 拦截，放行对外端口并持久化 ----
  # （端口取自 qihang-install.env 的 WEB_PORT，与甲骨文安全列表放行端口保持一致）
  - |
    set -a
    . /root/qihang-install.env
    set +a
    if [ -f /etc/iptables/rules.v4 ] && ! grep -q "dport ${WEB_PORT}" /etc/iptables/rules.v4; then
      iptables -I INPUT 5 -p tcp --dport "${WEB_PORT}" -j ACCEPT
      [ "${WEB_PORT}" = "80" ] && ! grep -q 'dport 443' /etc/iptables/rules.v4 && \
        iptables -I INPUT 6 -p tcp --dport 443 -j ACCEPT
      netfilter-persistent save 2>/dev/null || iptables-save > /etc/iptables/rules.v4
    fi

  # ---- [2] 下载部署脚本（私有仓库带 PAT），执行 install.sh 非交互安装 ----
  # 注意：runcmd 各段为独立 shell，须重新 source；POSIX 语法（无数组）
  - |
    set -a
    . /root/qihang-install.env
    set +a
    mkdir -p /root/oms-deploy
    cd /root/oms-deploy
    AUTH=""
    if [ -n "${GITHUB_TOKEN}" ]; then
      AUTH="-H \"Authorization: Bearer ${GITHUB_TOKEN}\""
    fi
    for f in install.sh qihang-oms.sh update.sh qihang-oms.service nginx-qihang-oms.conf; do
      curl -fsSL --retry 5 --retry-delay 3 --connect-timeout 15 ${AUTH} \
        "https://raw.githubusercontent.com/${GITHUB_REPO}/master/deploy/${f}" -o "${f}" \
      || echo "[cloud-init] 下载失败: ${f}（检查仓库名/分支/token）"
    done
    sed -i 's/\r$//' ./*.sh ./*.conf ./*.service 2>/dev/null || true
    chmod +x install.sh
    # stdin 非 TTY + QIHANG_NONINTERACTIVE=1 -> install.sh 自动进入非交互模式
    bash install.sh >> /var/log/qihang-install.log 2>&1

  # ---- [3] 动态 MOTD：每次 SSH 登录显示 OMS 状态（Ubuntu update-motd 标准机制） ----
  - |
    cat > /etc/update-motd.d/99-qihang-oms <<'MOTD'
    #!/bin/sh
    [ -f /etc/qihang-oms/install-result.env ] || exit 0
    . /etc/qihang-oms/install-result.env
    VERSION="${VERSION:-unknown}"
    DOMAIN="${DOMAIN:-_}"
    [ "${DOMAIN}" = "_" ] && ADDR="http://<服务器IP>" || ADDR="http://${DOMAIN}"
    printf "\n== 启航 OMS 已就绪 ==\n 版本: %s\n 访问: %s\n 账号: admin（首次登录后立即改密）\n 管理: qihang-oms（status/log/update）\n" \
      "$VERSION" "$ADDR"
    MOTD
    chmod +x /etc/update-motd.d/99-qihang-oms

  # ---- [4] 清理凭据文件（安装已完成，token 已持久化到 /root/.qihang_deploy_token） ----
  - rm -f /root/qihang-install.env

final_message: "启航 OMS cloud-init 完成（耗时 $UPTIME 秒）。日志: /var/log/cloud-init-output.log"
